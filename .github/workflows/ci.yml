name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run midway — it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only key; real secrets live in the deployment environment.
      SECRET_KEY: ci-insecure-test-key
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    name: Images (${{ matrix.service }})
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          if [ -z "$PUBLIC_HOST" ]; then
            echo "::error::Repository variable PUBLIC_HOST (VPS IP or domain) is not set"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remember-us-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the GHCR package to this repo so the deploy job's token can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ vars.PUBLIC_HOST }}/api/v1
            NEXT_PUBLIC_MEDIA_HOST=${{ vars.PUBLIC_HOST }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Secrets pasted from Windows often carry stray whitespace / CRLF — normalise them.
          host=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          for v in host user; do
            if [ -z "${!v}" ]; then echo "::error::Secret VPS_${v^^} is empty or not set"; exit 1; fi
          done
          case "$host$user" in *@*|*/*|*:*) echo "::error::VPS_HOST must be a bare IP/hostname and VPS_USER a bare user name"; exit 1;; esac
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::VPS_SSH_KEY is not a valid private key"; exit 1; }
          # Host keys are public: infra/known_hosts is the source of truth, the secret may add more.
          { cat infra/known_hosts; printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r'; } > ~/.ssh/known_hosts
          grep -qF "$host " ~/.ssh/known_hosts || { echo "::error::No host key for VPS_HOST in infra/known_hosts — run ssh-keyscan and commit it"; exit 1; }
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  BatchMode yes\n  ConnectTimeout 20\n' \
            "$host" "$user" > ~/.ssh/config
          ssh vps true
      - name: Upload infra files
        run: |
          scp -r infra/docker-compose.yml infra/deploy.sh infra/backup.sh infra/.env.prod.example infra/nginx \
            vps:/opt/remember-us/infra/
      - name: Release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh vps "cd /opt/remember-us/infra && bash deploy.sh ${{ github.sha }}"
          ssh vps "docker logout ghcr.io"
